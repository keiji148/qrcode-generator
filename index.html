<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生ゲームお金獲得ランキング</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
    .delete-button {
      padding: 5px 10px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .delete-button:hover {
      background-color: #d11a1a;
    }
  </style>
</head>
<body>
  <h1>人生ゲームお金獲得ランキング</h1>
  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" placeholder="名前を入力">
    <label for="amount">獲得金額:</label>
    <input type="number" id="amount" placeholder="金額を入力">
    <button onclick="addEntry()">追加</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>順位</th>
        <th>名前</th>
        <th>獲得金額</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="rankingTable">
      <!-- ランキングデータがここに追加されます -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
